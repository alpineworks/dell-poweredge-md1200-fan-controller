---
services:
  main:
    build: .
    ports:
      - "8081:8081"
    # The EMM console must be reachable from inside the container.
    # Replace with /dev/ttyUSB0 if you use a USB serial adapter.
    devices:
      - "/dev/ttyS0:/dev/ttyS0"
    restart: unless-stopped
    environment:
      # logging
      LOG_LEVEL: "info"

      # serial link to the EMM debug console (38400 8N1)
      SERIAL_PORT: "/dev/ttyS0"
      SERIAL_BAUDRATE: "38400"

      # fan control
      COMMAND_TYPE: "_shutup"  # or set_speed; identical behaviour
      COMMAND_VALUE: "20"  # percent; below 20 gets overridden by firmware
      SEND_INTERVAL: "2s"  # must stay well under ~10s
      TEMP_READ_INTERVAL: "60s"  # 0 disables _temp_rd polling
      MAX_AVG_TEMP_CELSIUS: "0"  # e.g. 40 to hand back to auto when hot

      # metrics
      METRICS_ENABLED: "true"
      METRICS_PORT: "8081"

      LOCAL: "true"

      # tracing
      TRACING_ENABLED: "false"
      TRACING_SAMPLERATE: "1.0"
      TRACING_SERVICE: "dell-poweredge-md1200-fan-controller"
      TRACING_VERSION: "0.0.1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://lgtm:4317"

      # grpc (otlp tracing)
      GRPC_GO_LOG_VERBOSITY_LEVEL: 99
      GRPC_GO_LOG_SEVERITY_LEVEL: info

  lgtm:
    image: grafana/otel-lgtm
    ports:
      - "3000:3000"  # Grafana UI
      - "4317:4317"  # OTLP
      - "4318:4318"  # OTLPHTTP
    volumes:
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - ./docker/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
